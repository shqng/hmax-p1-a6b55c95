<script>
/* Analysis was merged into the scoped Energy performance dashboard. Old links
   keep their scope; the view and supporting-detail toggles no longer exist. */
(function () {
  var KEEP = ['line', 'dir', 'band', 'fleet', 'hop', 'finding', 'period', 'compare'];
  var pairs = String(location.search || '').replace(/^\?/, '').split('&'), out = [], i, kv;
  for (i = 0; i < pairs.length; i++) {
    if (!pairs[i]) continue;
    kv = pairs[i].split('=');
    if (KEEP.indexOf(kv[0]) > -1 && kv[1]) out.push(kv[0] + '=' + kv[1]);
  }
  location.replace('overview.html' + (out.length ? '?' + out.join('&') : ''));
})();
