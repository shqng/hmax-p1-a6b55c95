<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>HMAX Energy Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="vendor/tailwind.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="charts.css">
<style>
  body{ display:flex; align-items:center; justify-content:center; min-height:100vh; padding:40px 24px; }
  .entry{ width:100%; max-width:940px; }
  .signin{
    background:var(--bg-elev-1); border:1px solid var(--border-soft);
    border-radius:18px; overflow:hidden;
  }
  .who{
    display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:14px;
    padding:15px 22px; width:100%; text-align:left;
    border-top:1px solid var(--border-soft);
    transition:background .13s ease;
  }
  .who:first-of-type{ border-top:none; }
  .who:hover{ background:var(--bg-elev-2); }
  .who-name{ font-size:13.5px; font-weight:600; color:var(--text-primary); }
  .who-role{ font-size:11.5px; color:var(--text-secondary); margin-top:2px; }
  .who-go{ display:flex; align-items:center; gap:10px; }
  .who-wait{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700;
    color:var(--amber); background:var(--amber-soft); border-radius:4px; padding:3px 7px;
  }
  .who-clear{ font-size:10.5px; color:var(--text-tertiary); }
  .who-arrow{ color:var(--text-tertiary); font-size:15px; }
  .who:hover .who-arrow{ color:var(--accent); }
  .status{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border-soft); }
  .status div{ background:var(--bg-elev-2); padding:13px 16px; }
</style>
</head>
<body>

<div class="entry" id="entry"></div>

<script src="data.js"></script>
<script src="network.js"></script>
<script src="render.js"></script>
<script src="charts.js"></script>
<script>
(function () {
  var H = window.HMAX, R = H.render, Q = H.query, N = H.net, X = H.charts;
  var esc = R.esc;
  document.body.setAttribute('data-depth', 'L3');

  var T = N.TOTAL;
  var gap = (T.kwhPerKm - T.baseline) / T.baseline * 100;

  var ORDER = ['epm', 'analyst', 'opm', 'rse'];

  function landing(k) {
    var nav = H.NAV[H.ROLES[k].nav[0]];
    for (var i = 0; i < H.ROLES[k].nav.length; i++) {
      var item = H.NAV[H.ROLES[k].nav[i]];
      if (item && item.href === H.ROLES[k].home) return item.label;
    }
    return nav ? nav.label : '';
  }

  document.getElementById('entry').innerHTML =

    '<div class="flex items-center gap-3 mb-7">' +
      '<div><div class="brand-name" style="font-size:19px">HMAX Energy Management</div>' +
      '<div class="brand-sub">' + esc(H.NETWORK.operator) + '</div></div>' +
      '<div class="ml-auto text-right">' +
        '<div class="mono text-[11px]" style="color:var(--text-tertiary)">' + esc(H.TODAY) + '</div>' +
        '<div class="text-[11px]" style="color:var(--text-tertiary)">Phase 1 · traction energy</div>' +
      '</div>' +
    '</div>' +

    '<div class="signin mb-5">' +
      '<div class="status">' +
        '<div><div class="metric-label">Network intensity</div>' +
          '<div class="metric-value" style="font-size:18px">' + T.kwhPerKm.toFixed(2) +
            '<span class="metric-unit">kWh/km</span></div>' +
          '<div class="metric-sub">' + X.delta(T.kwhPerKm, T.baseline) + ' against baseline</div></div>' +
        '<div><div class="metric-label">Open cases</div>' +
          '<div class="metric-value" style="font-size:18px">' + Q.openCases().length + '</div>' +
          '<div class="metric-sub">' + N.deviationsFor({ state: 'candidate' }).length +
            ' deviations awaiting triage</div></div>' +
        '<div><div class="metric-label">Verified this year</div>' +
          '<div class="metric-value" style="font-size:18px">' + H.PORTFOLIO.savings.verifiedMWh +
            '<span class="metric-unit">MWh</span></div>' +
          '<div class="metric-sub">' + H.PORTFOLIO.realisationOnVerified + '% of modelled saving realised</div></div>' +
        '<div><div class="metric-label">Data coverage</div>' +
          '<div class="metric-value" style="font-size:18px">' +
            Math.round(H.SOURCES.reduce(function (a, s) { return a + s.coverage; }, 0) / H.SOURCES.length) +
            '<span class="metric-unit">%</span></div>' +
          '<div class="metric-sub">Across ' + H.SOURCES.length + ' required record types</div></div>' +
      '</div>' +

      '<div class="px-6 pt-5 pb-3">' +
        '<div class="text-[12.5px] font-semibold" style="color:var(--text-primary)">Continue as</div>' +
        '<div class="text-[11.5px] mt-1" style="color:var(--text-secondary)">' +
          'Each role opens on the workspace its work starts from and sees only the surfaces its ' +
          'responsibilities require.</div>' +
      '</div>' +

      ORDER.map(function (k) {
        var r = H.ROLES[k];
        var waiting = Q.attentionFor(k).length;
        return '<button class="who" data-enter="' + k + '">' +
          '<span class="rs-avatar" style="width:34px;height:34px;font-size:12px;background:' + r.soft +
            ';color:' + r.color + '">' + esc(r.initials) + '</span>' +
          '<span style="min-width:0">' +
            '<span class="block who-name">' + esc(r.person) + '</span>' +
            '<span class="block who-role">' + esc(r.name) + ' · opens on ' + esc(landing(k)) + '</span>' +
          '</span>' +
          '<span class="who-go">' +
            (waiting
              ? '<span class="who-wait">' + waiting + ' waiting</span>'
              : '<span class="who-clear">nothing waiting</span>') +
            '<span class="who-arrow">\u2192</span>' +
          '</span>' +
        '</button>';
      }).join('') +
    '</div>' +

    '<div class="flex items-center gap-4 text-[11px]" style="color:var(--text-tertiary)">' +
      '<span>' + H.NETWORK.lines.length + ' lines · ' + N.UNITS.length + ' units · ' +
        N.INTERSTATIONS.length + ' interstations monitored</span>' +
      '<span class="ml-auto">' + H.SERVICES.length + ' automated services active · ' +
        H.STAGES.length + '-stage case lifecycle</span>' +
    '</div>';

  var bs = document.getElementsByTagName('button');
  for (var i = 0; i < bs.length; i++) {
    (function (b) {
      var k = b.getAttribute('data-enter');
      if (!k) return;
      b.addEventListener('click', function () {
        H.session.setRole(k);
        location.href = H.ROLES[k].home;
      });
    })(bs[i]);
  }
})();
</script>
</body>
</html>
